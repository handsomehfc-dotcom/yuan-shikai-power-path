<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>袁世凱：一步一步｜中三中史文字模擬 v2</title>
<style>
  :root{--bg:#f5f1ea;--card:#fffdfa;--ink:#202326;--muted:#62666a;--line:#d8d0c6;--accent:#174d6f;--accent2:#d8e9f2;--fact:#086b9d;--factbg:#e8f5fb;--dispute:#986000;--disputebg:#fff5d9;--sim:#68419b;--simbg:#f3ecfb;--event:#a9342b;--eventbg:#ffefec;--ok:#25683d;--warn:#8b4b14}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:"Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);line-height:1.58}
  .wrap{max-width:860px;margin:auto;padding:20px 14px 64px} header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
  h1{font-size:29px;margin:0 0 4px;line-height:1.2} h2{font-size:23px;margin:2px 0 10px} h3{font-size:18px;margin:15px 0 6px}.sub,.mini{color:var(--muted);font-size:13px}
  .progress{position:sticky;top:0;z-index:4;background:rgba(245,241,234,.95);backdrop-filter:blur(6px);padding:8px 0 10px;margin-bottom:8px}.bar{height:8px;background:#e2dbd1;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:.3s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 5px 20px rgba(0,0,0,.045)}
  .tag,.chip{display:inline-block;padding:3px 8px;border-radius:999px;font-weight:750;font-size:12px}.tag{margin-bottom:8px}.fact{color:var(--fact);background:var(--factbg)}.dispute{color:var(--dispute);background:var(--disputebg)}.sim{color:var(--sim);background:var(--simbg)}.event{color:var(--event);background:var(--eventbg)}
  .context{background:#faf7f1;border-left:4px solid #aa9d8d;padding:11px 13px;margin:12px 0;border-radius:8px}.question{background:#eef5f8;border-left:4px solid var(--accent);padding:12px 14px;margin:14px 0;border-radius:8px;font-weight:700}.prompt{border:1px dashed #917bae;background:#fbf8ff;padding:10px 12px;border-radius:10px;margin:12px 0;font-weight:650}
  .choice{width:100%;text-align:left;background:white;border:1px solid #cfc6ba;border-radius:12px;padding:13px 14px;margin:7px 0;cursor:pointer;font:inherit;color:inherit;transition:.15s}.choice:hover{border-color:#6a8799;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.06)}.choice strong{display:block;margin-bottom:2px}.choice small{color:var(--muted);font-size:13px}
  button.next{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:750;cursor:pointer;margin-top:12px}button.ghost{background:transparent;border:1px solid #999;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
  .impact{margin:12px 0;padding:12px;background:#f2f4f2;border-radius:10px}.route{border-left:4px solid var(--accent);padding-left:14px;margin:12px 0}.step{margin:10px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.compare h3{margin-top:0}.row{padding:9px 0;border-bottom:1px solid #e7e0d8}.row:last-child{border-bottom:0}.arrow{color:var(--accent);font-weight:800}.status{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.easy{background:#e7f4ea;color:var(--ok)}.hard{background:#fff0e5;color:var(--warn)}.mid{background:#eceff1;color:#454c51}.legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .people{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.person{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.person b{display:block;color:var(--accent)}
  .limits{margin:14px 0}.limits h3{margin:0 0 8px;font-size:16px}.limit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.limit-card{border:2px solid;border-radius:12px;padding:11px;background:#fff}.limit-card b{display:block;font-size:14px;margin-bottom:3px}.limit-card span{font-weight:800}.limit-strong{border-color:#3f7896;background:#eaf5fa;color:#174d6f}.limit-mid{border-color:#d29433;background:#fff7df;color:#82540d}.limit-low{border-color:#b6574f;background:#fff0ee;color:#862f29}.resultbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.resultbox h3{margin:0 0 5px;font-size:17px;color:var(--accent)}
  .resistance{border:2px solid #b16c35;background:#fff7ed;border-radius:12px;padding:13px;margin:12px 0;font-size:18px;font-weight:800}.attempt{background:#762f2a!important}.outcome{border:2px solid var(--accent);background:#f4f9fb;border-radius:12px;padding:14px;margin:12px 0}.outcome h3{margin-top:0}.attempt-result{border-radius:12px;padding:14px;margin:12px 0;font-size:20px;font-weight:900}.attempt-success{background:#e8f5ec;border:2px solid #39734d;color:#245b37}.attempt-partial{background:#fff6da;border:2px solid #c58a26;color:#7d5209}.attempt-failure{background:#ffefed;border:2px solid #b7544b;color:#812e28}
  .identity{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.identity label{font-weight:750}.identity select{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid #b8afa5;border-radius:9px;background:#fff;font:inherit}.sync{min-height:18px;color:var(--muted);font-size:11px;margin-top:2px}.checkpoint{border:2px solid #7c63a4;background:#f8f3ff;border-radius:12px;padding:14px;margin:14px 0}.checkpoint b{display:block;color:#583286;margin-bottom:4px}.stop{border:2px solid #ad7135;background:#fff7e8;border-radius:12px;padding:14px;margin:14px 0}.teacher-table{width:100%;border-collapse:collapse;font-size:12px}.teacher-table th,.teacher-table td{border:1px solid var(--line);padding:6px;text-align:left}.teacher-table th{background:#e9f1f5}
  .footer-note{font-size:12px;color:#747474;margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
  @media(max-width:620px){h1{font-size:24px}.card{padding:16px}.two,.people,.limit-grid,.identity{grid-template-columns:1fr}}
  @media print{.progress,.next,.ghost{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body><div class="wrap">
<header><div><h1>袁世凱：一步一步</h1><div class="sub">中三中國歷史｜文字分支模擬 v2</div><div id="syncStatus" class="sync"></div></div><button class="ghost" onclick="restart()">重新開始</button></header>
<div class="progress"><div class="bar"><div id="fill" class="fill"></div></div><div id="progtext" class="mini" style="margin-top:4px">開始</div></div>
<main id="app"></main>
<div class="footer-note">主要史實依據：課本《中華民國》「民初軍閥政治」第19至23頁。模擬選項用來理解因果與政治條件，不代表袁世凱當時實際擁有這份選單；模擬後果亦不是對另一段歷史的斷言。</div>
</div><script>
// 老師只需要把Google Apps Script Web App網址貼在下一行。
const DATA_ENDPOINT = "";
const CLASS_OPTIONS = ['3A','3B','3C','3D'];
const DATA_QUEUE_KEY='yuan_power_path_queue_v1',DATA_LOCAL_KEY='yuan_power_path_local_v1',IDENTITY_KEY='yuan_power_path_identity_v1';
const S={d1:null,d2:null,d3:null,d4:null,resources:0,control:0,checks:2,conflict:0,local:1,log:[]};
const STUDENT={classCode:'',seatNumber:'',sessionId:getSessionId()};
let decisionStartedAt=Date.now(),decisionStage='',completionSent=false,sending=false;
const app=document.getElementById('app');
const stages=['序幕','宋教仁事件','D1 善後大借款','D2與二次革命','D3 國會','D4 臨時約法','1915 帝制嘗試','模擬結果','真實歷史'];
function progress(n){document.getElementById('fill').style.width=(n/(stages.length-1)*100)+'%';document.getElementById('progtext').textContent=stages[n]}
function card(cls,tag,title,body){const badge=(tag==='你的模擬結果'||tag==='真實歷史中的袁世凱')?`<span class="tag ${cls}">【${tag}】</span>`:'';return `<section class="card">${badge}<h2>${title}</h2>${body}</section>`}
function set(html,n){app.innerHTML=html;progress(n);window.scrollTo({top:0,behavior:'smooth'})}
function next(label,fn){return `<button class="next" onclick="${fn}">${label}</button>`}
function choice(code,title,desc,fn){return `<button class="choice" onclick="handleChoice('${fn}','${code}')"><strong>${code}｜${title}</strong><small>${desc}</small></button>`}
function currentDecisionResistance(){if(decisionStage==='D2')return d2Resistance();if(decisionStage==='D3')return d3Resistance();if(decisionStage==='D4')return d4Resistance();return ''}
function handleChoice(fn,code){const previous=snapshotState(),time=decisionTime(),resistance=currentDecisionResistance(),stage=decisionStage;if(fn==='pickD1')pickD1(code);else if(fn==='pickD2')pickD2(code);else if(fn==='pickD3')pickD3(code);else if(fn==='pickD4')pickD4(code);else return;recordEvent('decision',stage,code,previous,snapshotState(),resistance,'in_progress',time)}
function uid(){try{return crypto.randomUUID()}catch(e){return 's-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}}
function getSessionId(){try{let id=sessionStorage.getItem('yuan_power_path_session');if(!id){id=uid();sessionStorage.setItem('yuan_power_path_session',id)}return id}catch(e){return uid()}}
function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)||'null')||fallback}catch(e){return fallback}}
function writeJSON(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
function snapshotState(){return {d1:S.d1,d2:S.d2,d3:S.d3,d4:S.d4,resources:S.resources,control:S.control,checks:S.checks,conflict:S.conflict,local:S.local}}
function beginDecision(stage){decisionStage=stage;decisionStartedAt=Date.now()}
function decisionTime(){return Math.max(0,Date.now()-decisionStartedAt)}
function setSync(text){const el=document.getElementById('syncStatus');if(el)el.textContent=text||''}
function recordEvent(eventType,stage,choiceValue,previousState,resultState,resistance,completionStatus,timeMs){
  if(!STUDENT.classCode||!STUDENT.seatNumber)return;
  const event={event_id:uid(),timestamp:new Date().toISOString(),class:STUDENT.classCode,seat_number:STUDENT.seatNumber,session_id:STUDENT.sessionId,event_type:eventType,stage,choice:choiceValue||'',previous_state:previousState||{},result_state:resultState||{},current_resistance:resistance||'',completion_status:completionStatus||'in_progress',decision_time_ms:Number(timeMs)||0};
  const local=readJSON(DATA_LOCAL_KEY,[]);local.push(event);writeJSON(DATA_LOCAL_KEY,local.slice(-300));
  if(DATA_ENDPOINT){const queue=readJSON(DATA_QUEUE_KEY,[]);queue.push(event);writeJSON(DATA_QUEUE_KEY,queue.slice(-300));flushQueue()}
}
async function flushQueue(){
  if(sending||!DATA_ENDPOINT)return;
  const queue=readJSON(DATA_QUEUE_KEY,[]);if(!queue.length){setSync('');return}
  sending=true;setSync('紀錄同步中');
  try{while(queue.length){await fetch(DATA_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(queue[0]),keepalive:true});queue.shift();writeJSON(DATA_QUEUE_KEY,queue)}setSync('')}
  catch(e){writeJSON(DATA_QUEUE_KEY,queue);setSync('')}
  finally{sending=false}
}
function isTeacherMode(){try{return new URLSearchParams(window.location.search).get('teacher')==='1'}catch(e){return false}}
function identityScreen(){
  const saved=readJSON(IDENTITY_KEY,{});const classes=CLASS_OPTIONS.map(x=>`<option value="${x}" ${saved.classCode===x?'selected':''}>${x}</option>`).join('');const seats=Array.from({length:40},(_,i)=>String(i+1).padStart(2,'0')).map(x=>`<option value="${x}" ${saved.seatNumber===x?'selected':''}>${x}</option>`).join('');
  set(card('fact','已核證史實','開始前',`<p>請選擇班別及座號，然後開始遊戲。</p><div class="identity"><label>班別<select id="classInput"><option value="">請選擇</option>${classes}</select></label><label>座號<select id="seatInput"><option value="">請選擇</option>${seats}</select></label></div><p id="identityError" class="mini"></p><button class="next" onclick="saveIdentityAndStart()">開始遊戲</button>`),0)
}
function saveIdentityAndStart(){const c=document.getElementById('classInput').value,s=document.getElementById('seatInput').value;if(!CLASS_OPTIONS.includes(c)||!/^(0[1-9]|[1-3][0-9]|40)$/.test(s)){document.getElementById('identityError').textContent='請選擇班別及座號。';return}STUDENT.classCode=c;STUDENT.seatNumber=s;writeJSON(IDENTITY_KEY,{classCode:c,seatNumber:s});recordEvent('session_start','START','',{},snapshotState(),'','in_progress',0);start()}
function teacherScreen(){const rows=readJSON(DATA_LOCAL_KEY,[]),endpoint=DATA_ENDPOINT?'已設定':'未設定';const body=rows.slice(-30).reverse().map(e=>`<tr><td>${e.class}</td><td>${e.seat_number}</td><td>${e.stage}</td><td>${e.choice||'-'}</td><td>${e.current_resistance||'-'}</td></tr>`).join('');set(card('fact','已核證史實','教師模式｜本機測試資料',`<p><b>DATA endpoint：</b>${endpoint}　<b>本機事件：</b>${rows.length}</p><p class="mini">只顯示這部裝置的測試資料；全班資料請到Google Sheet查看。</p><table class="teacher-table"><thead><tr><th>班別</th><th>座號</th><th>階段</th><th>選擇</th><th>阻力</th></tr></thead><tbody>${body||'<tr><td colspan="5">暫無本機資料</td></tr>'}</tbody></table><button class="ghost" onclick="clearLocalTestData()">清除本機測試資料</button>`),0)}
function clearLocalTestData(){try{localStorage.removeItem(DATA_LOCAL_KEY);localStorage.removeItem(DATA_QUEUE_KEY)}catch(e){}teacherScreen()}
function consequence(done,later){return `<div class="two"><div class="resultbox"><h3>今次你做到咩？</h3><p>${done}</p></div><div class="resultbox"><h3>同時，之後有咩改變？</h3><p>${later}</p></div></div>`}
function limitCard(label,value,level){return `<div class="limit-card limit-${level}"><b>${label}</b><span>${value}</span></div>`}
function limitsPanel(){let local='仍有較強作用',localLevel='strong',parliament='仍有較強作用',parliamentLevel='strong',rules='仍有較強作用',rulesLevel='strong';if(S.d2==='B'){local='受到部分削弱';localLevel='mid'}if(S.d2==='C'){local='作用明顯下降';localLevel='low'}if(S.d3==='B'){parliament='受到部分削弱';parliamentLevel='mid'}else if(S.d3==='C'){parliament='作用明顯下降';parliamentLevel='low'}else if(!S.d3&&S.d1==='C'){parliament='實際作用受到挑戰';parliamentLevel='mid'}if(S.d4==='B'){rules='受到部分削弱';rulesLevel='mid'}if(S.d4==='C'){rules='作用明顯下降';rulesLevel='low'}return `<div class="limits"><h3>目前仍有作用的限制</h3><div class="limit-grid">${limitCard('地方政治力量',local,localLevel)}${limitCard('國會',parliament,parliamentLevel)}${limitCard('《臨時約法》／制度規則',rules,rulesLevel)}</div></div>`}
function start(){set(card('fact','已核證史實','1912｜你成為民國總統',`
<p>辛亥革命後，清帝退位，中華民國成立。袁世凱其後出任臨時大總統。</p>
<div class="context">你掌握北洋軍等重要力量，但新的共和制度亦設有<b>國會</b>、《臨時約法》等安排。你雖然是總統，仍然有人和制度可以限制你的政治行動。</div>
<p><b>你有權力，但仍然有人和制度可以限制你。</b></p>
<div class="prompt">課堂筆記第2頁：在「1912 開局」一行評估權力掌握度 ★★★★★。</div>
<p class="mini">遊戲中的選擇與後果屬反事實模擬，不等於真實歷史；袁世凱的真實路線會另外顯示。遊戲沒有勝負或道德分數。</p>${next('進入1913年','eventSong()')}`),0)}
function eventSong(){set(card('event','已核證史實','突發事件｜國會與宋教仁',`
<p>國民黨在國會選舉中取得重要優勢。宋教仁主張透過議會及責任內閣，使政府受到國會制衡。</p>
<p>1913年3月，<b>宋教仁遇刺身亡</b>。事件令本來緊張的政治關係進一步惡化。</p>
<div class="context"><b>爭議提示：</b>宋教仁案的幕後責任存在不同歷史解釋，不能把「袁世凱下令刺殺」當作已確定史實。</div>
<p><b>你沒有選擇這件事發生，但你的政治環境已經改變。</b></p>${next('進入 Decision 1','d1()')}`),1)}
function d1(){beginDecision('D1');set(card('sim','反事實模擬','Decision 1｜善後大借款',`
<p><b>歷史背景：</b>民國初年，中央政府財政困難，需要大量資金維持政府運作及軍政開支。1913年，政府準備向五國銀行團借款2,500萬英鎊。</p>
<p>袁亦希望利用資金擴充軍政力量、鞏固中央及個人勢力。因此，這不只是一般政府周轉問題。</p>
<p>但《臨時約法》下，國會本來有權參與公債、預算及涉及國庫的重大事項。國會因此反對政府在未獲批准前完成這筆巨額借款。</p>
<div class="context"><b>你現在手上的問題</b><br><b>等國會：</b>程序較完整，但取得資金可能較慢。<br><b>不等國會：</b>可以較快取得資金，但會削弱國會在重大財政決定中的作用。</div>
<div class="prompt">作出選擇後，返回課堂筆記第2頁記錄D1。</div>
${choice('A','先交國會審議','接受程序與協商時間，等國會批准。','pickD1')}${choice('B','修改方案再談','調整借款規模或條件，換取國會支持。','pickD1')}${choice('C','直接完成借款','不等國會批准，盡快取得資金。','pickD1')}`),2)}
function pickD1(x){S.d1=x;let done='',later='';if(x==='A'){S.resources-=1;S.checks+=1;S.control-=1;S.conflict-=1;done='國會仍然參與重大借款決定；政府依照制度程序處理借款。';later='國會仍保持較強的實際作用。如果之後想進一步削弱制度限制，在本模擬中面對的阻力會較大。'}if(x==='B'){done='借款與國會協商之間暫時保留空間，政府仍有機會取得部分所需資金。';later='國會與政府的權力分歧仍未完全解決。之後採取重大行動，仍需要處理制度及政治協商。'}if(x==='C'){S.resources+=2;S.control+=1;S.checks-=1;S.conflict+=2;done='你較直接取得大筆資金，可以增加中央政府的軍政資源。';later='國會的反對沒有阻止政府完成這項重大決定。之後再繞過國會採取行動，在本模擬中會比開局時容易。'}S.log.push(['善後大借款',x]);set(card('sim','你的模擬結果','D1 後果',`${consequence(done,later)}${limitsPanel()}<div class="prompt">工作紙 D1：自己評權力掌握度 ★★★★★，再寫一項證據。</div><p class="mini"><b>真實歷史另外顯示：</b>袁實際在國會反對下完成善後大借款。</p>${next('帶着新條件前進','d2()')}`),2)}
function d2Intro(){if(S.d1==='A')return '你讓國會參與借款，沒有再因借款程序增加一層直接衝突；國會亦保持實際作用。但中央與國民黨原有的矛盾仍在。';if(S.d1==='B')return '借款問題仍留下協商空間，但中央政府與國民黨的政治分歧並未消失。';return '你較快取得中央軍政資源；同時，未經國會同意借款令政府與國會、國民黨的政治衝突加深。借款不是之後衝突的唯一原因，但它改變了中央的資源與互信條件。';}
function d2Resistance(){return S.d1==='A'?'高':S.d1==='C'?'較低':'中'}
function d2(){beginDecision('D2');set(card('sim','反事實模擬','Decision 2｜國民黨籍都督',`
<div class="context"><b>上一個決定留下的局勢：</b>${d2Intro()}</div>
<div class="resistance">目前處理地方政治力量的阻力：${d2Resistance()}</div>
<p><b>歷史背景：</b>國民黨的力量不只在國會，也在部分地方省份。宋教仁案及善後大借款令袁政府與國民黨的政治矛盾累積、互信下降。三個重要省份由國民黨籍都督掌握，中央不能完全控制地方；但此時三人並未共同起兵。</p>
